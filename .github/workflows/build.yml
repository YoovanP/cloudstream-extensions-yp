name: Build

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "*.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          path: src

      - name: Checkout builds branch
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: builds
          path: builds

      - name: Prepare builds branch
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/builds/.git" ]; then
            rm -rf "$GITHUB_WORKSPACE/builds"
            mkdir -p "$GITHUB_WORKSPACE/builds"
            cd "$GITHUB_WORKSPACE/builds"
            git init
            git checkout --orphan builds
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Build plugins
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          ./gradlew make makePluginsJson

      - name: Publish artifacts to builds branch
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          rm -f ./*.cs3 ./*.jar ./plugins.json
          cp "$GITHUB_WORKSPACE"/src/*/build/*.cs3 ./
          cp "$GITHUB_WORKSPACE"/src/build/plugins.json ./
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          if [ -n "$(git status --short)" ]; then
            git commit -m "Build $GITHUB_SHA"
            for attempt in 1 2 3 4 5; do
              if git -c http.version=HTTP/1.1 push origin HEAD:builds --force; then
                exit 0
              fi

              remote_sha="$(git ls-remote origin refs/heads/builds | cut -f1 || true)"
              local_sha="$(git rev-parse HEAD)"
              if [ "$remote_sha" = "$local_sha" ]; then
                echo "Build artifacts were published despite a push transport error."
                exit 0
              fi

              if [ "$attempt" -eq 5 ]; then
                echo "Failed to publish build artifacts after $attempt attempts."
                exit 1
              fi

              sleep "$((attempt * 15))"
            done
          else
            echo "No changes to publish"
          fi
